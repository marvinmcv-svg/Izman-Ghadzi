  <script>
    // Apply the saved theme before the page paints, so it never flashes.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('ps.theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="float-root"></div>
  <div id="pdf-root"></div>
  <noscript><p style="padding:40px;color:#fff">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
